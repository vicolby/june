id: PY014
language: python
severity: error
message: "Comparison to None with == or !=. Fix: use is None or is not None."
rule:
  kind: comparison_operator
  has:
    all:
      - any:
          - kind: none
          - all:
              - kind: parenthesized_expression
              - has:
                  kind: none
                  stopBy:
                    not:
                      kind: parenthesized_expression
      - any:
          - follows:
              regex: '^==$'
          - follows:
              regex: '^!=$'
          - precedes:
              regex: '^==$'
          - precedes:
              regex: '^!=$'
