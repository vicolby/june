id: PY012
language: python
severity: error
message: "Mutable default argument. Fix: default the parameter to None and create the value inside the function."
rule:
  any:
    - kind: default_parameter
    - kind: typed_default_parameter
  has:
    field: value
    any:
      - kind: list
      - kind: dictionary
      - kind: set
      - kind: list_comprehension
      - kind: dictionary_comprehension
      - kind: set_comprehension
