id: PY016
language: python
severity: error
message: "Assert on a tuple is always true. Fix: remove the parentheses and pass the message after a comma, as in assert cond, message."
rule:
  kind: tuple
  has:
    nthChild:
      position: "n"
      ofRule:
        not:
          any:
            - kind: list_splat
            - kind: parenthesized_list_splat
            - all:
                - kind: parenthesized_expression
                - has:
                    any:
                      - kind: list_splat
                      - kind: parenthesized_list_splat
                    stopBy:
                      not:
                        kind: parenthesized_expression
  any:
    - all:
        - nthChild:
            position: 1
            ofRule:
              not:
                any:
                  - kind: line_continuation
                  - kind: comment
        - inside:
            kind: assert_statement
            stopBy: neighbor
    - all:
        - inside:
            kind: assert_statement
            stopBy:
              not:
                kind: parenthesized_expression
        - inside:
            kind: parenthesized_expression
            nthChild:
              position: 1
              ofRule:
                not:
                  any:
                    - kind: line_continuation
                    - kind: comment
            stopBy:
              inside:
                kind: assert_statement
                stopBy: neighbor
