id: PY016
valid:
  - "assert x"
  - "assert x, 'msg'"
  - "assert (x)"
  - "assert (x), 'msg'"
  - "assert x, (1, 2)"
  - "assert ()"
  - "t = (x, 'msg')"
  - "assert (*items,)"
  - "assert (*a, *b)"
  - "assert (**k,)"
  - "assert x, ((1, 2))"
  - "assert ((*a, *b))"
  - "assert (())"
invalid:
  - "assert (x, 'msg')"
  - "assert (x,)"
  - "assert (x, 'msg'), 'other'"
  - "assert (\n    x,\n    'msg',\n)"
  - "assert ((ok, 'failed'))"
  - "assert (((ok, 'failed')))"
  - "assert (ok, *rest)"
  - "assert \\\n    (x, 'msg')"
