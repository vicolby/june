id: PY012
valid:
  - "def f(a=None): pass"
  - "def f(a=(), b=1, c='x'): pass"
  - "def f(a: int = 0): pass"
  - "x = []"
invalid:
  - "def f(a=[]): pass"
  - "def f(a={}): pass"
  - "def f(a={1, 2}): pass"
  - "def f(a=[i for i in range(3)]): pass"
  - "def f(a: list = []): pass"
  - "lambda a=[]: a"
