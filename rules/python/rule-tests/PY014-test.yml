id: PY014
valid:
  - "x is None"
  - "x is not None"
  - "x == 0"
  - "x != 'None'"
  - "x == [None]"
  - "x = None"
  - "f(None)"
  - "a == b is None"
  - "x == (None,)"
  - "a == b is \\\n None"
  - "assert (result is None) == expected"
  - "a == (b is None)"
  - "a == (b is not None)"
  - "(b is None) == a"
  - "a == (None in xs)"
  - "a != (None not in xs)"
  - "a == (b < None)"
  - "a == ((b is None))"
  - "x == (a is None or b)"
  - "a == (b is (None))"
  - "x == (f(None))"
  - "x == (None + 1)"
  - "x == (not None)"
  - "a == (b is \\\n None)"
  - "a == (b is # c\n None)"
invalid:
  - "x == None"
  - "x != None"
  - "None == x"
  - "None != x"
  - "if f(a) == None: pass"
  - "y = [a.b != None for a in c]"
  - "x == (None)"
  - "x != ((None))"
  - "(None) == x"
  - "(None) != x"
  - "a == b == None"
  - "a != b != None"
  - "None == x == y"
  - "a is None == b"
  - "x == (y == None)"
  - "x == (y == (None))"
  - "value == \\\n None"
  - "None \\\n == x"
  - "x == # c\n None"
  - "x == \\\n (None)"
  - "x != \\\n None"
  - "None \\\n != x"
