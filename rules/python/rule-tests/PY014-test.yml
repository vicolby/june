id: PY014
valid:
  - "x is None"
  - "x is not None"
  - "x == 0"
  - "x != 'None'"
  - "x == [None]"
  - "x = None"
  - "f(None)"
  - "a == b is None"
  - "x == (None,)"
invalid:
  - "x == None"
  - "x != None"
  - "None == x"
  - "None != x"
  - "if f(a) == None: pass"
  - "y = [a.b != None for a in c]"
  - "x == (None)"
  - "x != ((None))"
  - "(None) == x"
  - "(None) != x"
  - "a == b == None"
  - "a != b != None"
  - "None == x == y"
  - "a is None == b"
