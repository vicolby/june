name: june
description: Check the lines a change touches against your guideline rules. Installs june and ast-grep, then runs june, and optionally asks a model to review the same lines (experimental).
inputs:
  version:
    description: june release to install, X.Y.Z. Default is the release the action is pinned to (uses vicolby/june@vX.Y.Z); required for any other ref.
    default: ""
  rules:
    description: Rules directory. Omit to use the repository configuration.
    default: ""
  base:
    description: Git ref to judge changes against. Default is the pull request base, or the merge group base in a merge queue.
    default: ""
  ai-model:
    description: Experimental. The OpenAI model that reviews the touched lines against ai-rules. Empty skips the review step.
    default: ""
  ai-rules:
    description: Experimental. The one Markdown file of rules the model reviews against, relative to the repository. Required with ai-model.
    default: ""
  ai-effort:
    description: Experimental. Reasoning effort for the model, as the API spells it. Empty leaves it to the model.
    default: ""
  ai-skill:
    description: Experimental. A skill directory or file whose body replaces the default review instruction. Not with ai-prompt.
    default: ""
  ai-prompt:
    description: Experimental. An instruction that replaces the default review instruction. Not with ai-skill.
    default: ""
  openai-api-key:
    description: Experimental. The OpenAI API key for the review, from a secret, for example secrets.OPENAI_API_KEY. Pull requests from forks have no secrets, and the review then only warns.
    default: ""
runs:
  using: composite
  steps:
    - name: Install june and ast-grep
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -eu
        version=$INPUT_VERSION
        if [ -z "$version" ]; then
          case "$ACTION_REF" in
          v[0-9]*.[0-9]*.[0-9]*) version=${ACTION_REF#v} ;;
          *)
            echo "::error title=june::set the version input, or pin the action to a release tag (vicolby/june@vX.Y.Z); got ref '$ACTION_REF'"
            exit 1
            ;;
          esac
        fi
        bin="$RUNNER_TEMP/june-bin"
        export npm_config_prefix="$RUNNER_TEMP/june-npm"
        # install.sh checks the release sha256 and installs the ast-grep release june is tested against.
        JUNE_VERSION=$version JUNE_INSTALL_DIR=$bin JUNE_INSTALL_AST_GREP=1 sh "$GITHUB_ACTION_PATH/install.sh"
        echo "$bin" >> "$GITHUB_PATH"
        echo "$npm_config_prefix/bin" >> "$GITHUB_PATH"
    - name: Run june
      shell: bash
      env:
        INPUT_RULES: ${{ inputs.rules }}
        INPUT_BASE: ${{ inputs.base }}
      run: |
        set -eu
        set --
        if [ -n "$INPUT_RULES" ]; then
          set -- "$@" --rules "$INPUT_RULES"
        fi
        if [ -n "$INPUT_BASE" ]; then
          set -- "$@" --base "$INPUT_BASE"
        fi
        june "$@"
    - name: Review with a model
      if: inputs.ai-model != ''
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        INPUT_AI_MODEL: ${{ inputs.ai-model }}
        INPUT_AI_RULES: ${{ inputs.ai-rules }}
        INPUT_AI_EFFORT: ${{ inputs.ai-effort }}
        INPUT_AI_SKILL: ${{ inputs.ai-skill }}
        INPUT_AI_PROMPT: ${{ inputs.ai-prompt }}
        INPUT_BASE: ${{ inputs.base }}
      run: |
        set -eu
        set -- --rules "$INPUT_AI_RULES" --model "$INPUT_AI_MODEL"
        if [ -n "$INPUT_AI_EFFORT" ]; then
          set -- "$@" --effort "$INPUT_AI_EFFORT"
        fi
        if [ -n "$INPUT_AI_SKILL" ]; then
          set -- "$@" --skill "$INPUT_AI_SKILL"
        fi
        if [ -n "$INPUT_AI_PROMPT" ]; then
          set -- "$@" --prompt "$INPUT_AI_PROMPT"
        fi
        if [ -n "$INPUT_BASE" ]; then
          set -- "$@" --base "$INPUT_BASE"
        fi
        june review "$@"
