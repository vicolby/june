name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The suite runs with the race detector on Linux and macOS: june shells out to git and
  # ast-grep, and path and tool behaviour differs between the two.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install pinned ast-grep
        run: npm install --global "@ast-grep/cli@$(cat .ast-grep-version)"
      - name: Check ast-grep version
        run: test "$(ast-grep --version)" = "ast-grep $(cat .ast-grep-version)"
      - run: go vet ./...
      - run: go test -race ./...
      # The binary on a fixture repository, with the variables GitLab sets in a merge request
      # pipeline. A real GitLab pipeline needs a GitLab runner and project: see COMPATIBILITY.md.
      - name: Simulated GitLab pipeline on a fixture repository
        run: |
          go build -o "$RUNNER_TEMP/june" ./cmd/june
          JUNE="$RUNNER_TEMP/june" sh testdata/e2e/run.sh gitlab

  # june on a real GitHub Actions runner against a fixture repository. The step fails the way a
  # user's does, and the next job reads the annotations back from the API, so the check covers what
  # the runner and GitHub do with june's workflow commands and not only what june prints.
  e2e-github:
    name: e2e github
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install pinned ast-grep
        run: npm install --global "@ast-grep/cli@$(cat .ast-grep-version)"
      - run: go build -o "$RUNNER_TEMP/june" ./cmd/june
      - name: june on the fixture repository
        id: june
        continue-on-error: true
        run: JUNE="$RUNNER_TEMP/june" sh testdata/e2e/run.sh github
      - name: The fixture's error fails the step
        env:
          OUTCOME: ${{ steps.june.outcome }}
        run: test "$OUTCOME" = failure

  e2e-github-annotations:
    name: e2e github annotations
    needs: e2e-github
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: The runner turned june's output into an annotation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name == "e2e github") | .id')
          test -n "$job"
          gh api "repos/$GITHUB_REPOSITORY/check-runs/$job/annotations" | tee annotations.json
          jq -e '[.[] | select(.path == "app.py" and .start_line == 2 and .annotation_level == "failure" and .title == "PY012")] | length == 1' annotations.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install pinned golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$(cat .golangci-lint-version)"
      - name: Check golangci-lint version
        run: test "$(golangci-lint --version | awk '{print $4}')" = "$(sed s/^v// .golangci-lint-version)"
      - name: Lint
        run: golangci-lint run ./...
      - name: Format check
        run: golangci-lint fmt --diff

  # Builds the release archives without publishing and installs from them with install.sh, so a
  # broken goreleaser config or installer fails here instead of on the first tag push.
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Install from the snapshot archive with install.sh
        id: snapshot
        run: |
          set -eu
          version=$(jq -r .version dist/metadata.json)
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          case "$(uname -m)" in x86_64) arch=amd64 ;; *) arch=arm64 ;; esac
          base="$RUNNER_TEMP/releases"
          mkdir -p "$base/download/v$version"
          cp dist/*.tar.gz dist/checksums.txt "$base/download/v$version/"
          JUNE_RELEASES_URL="file://$base" JUNE_VERSION="$version" \
            JUNE_INSTALL_DIR="$RUNNER_TEMP/bin" \
            sh install.sh
          test "$("$RUNNER_TEMP/bin/june" --version | head -n 1)" = "june $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releases=file://$base" >> "$GITHUB_OUTPUT"
      - name: Run the action at HEAD
        id: action-refusal
        continue-on-error: true
        uses: ./
        env:
          JUNE_RELEASES_URL: ${{ steps.snapshot.outputs.releases }}
        with:
          version: ${{ steps.snapshot.outputs.version }}
          rules: testdata/rules/python
          base: HEAD
      - name: Check the action outcome
        env:
          ACTION_OUTCOME: ${{ steps.action-refusal.outcome }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$ACTION_OUTCOME" = failure
          else
            test "$ACTION_OUTCOME" = success
          fi
      - name: Check what the action installed
        run: |
          set -eu
          test "$(june --version | head -n 1)" = "june ${{ steps.snapshot.outputs.version }}"
          test "$(ast-grep --version)" = "ast-grep $(cat .ast-grep-version)"
