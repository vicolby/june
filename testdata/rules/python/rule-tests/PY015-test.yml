id: PY015
valid:
  - "try:\n    f()\nexcept ValueError:\n    log()"
  - "try:\n    f()\nexcept ValueError:\n    raise"
  - "try:\n    f()\nexcept ValueError:\n    pass\n    log()"
  - "try:\n    f()\nexcept ValueError:\n    log()\n    pass"
  - "def f():\n    pass"
  - "if x:\n    pass"
  - "try:\n    f()\nexcept ValueError:\n    pass; x = 1"
  - "try:\n    f()\nexcept ValueError:\n    pass; \\\n    x = 1"
invalid:
  - "try:\n    f()\nexcept ValueError:\n    pass"
  - "try:\n    f()\nexcept:\n    pass"
  - "try:\n    f()\nexcept ValueError as e:\n    pass"
  - "try:\n    f()\nexcept ValueError:\n    # ignored on purpose\n    pass"
  - "try:\n    f()\nexcept ValueError: pass"
  - "try:\n    f()\nexcept ValueError: pass;"
  - "try:\n    f()\nexcept ValueError:\n    pass;"
  - "try:\n    f()\nexcept ValueError:\n    pass; pass"
  - "try:\n    f()\nexcept* ValueError:\n    pass"
  - "try:\n    f()\nexcept ValueError:\n    pass; \\\n    pass"
  - "try:\n    f()\nexcept ValueError: pass; \\\n    pass"
  - "try:\n    f()\nexcept ValueError:\n    pass\\\n    ; pass"
  - "try:\n    f()\nexcept:\n    pass; \\\n    pass"
  - "try:\n    f()\nexcept* ValueError:\n    pass; \\\n    pass"
