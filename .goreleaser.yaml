# Release config. A version tag (v*) triggers .github/workflows/release.yml, which runs goreleaser.
# Archives carry the june binary and the bundled rules; the Homebrew formula installs them to
# <prefix>/share/june/rules, which `june rules-path` prints.
version: 2

project_name: june

before:
  hooks:
    - go mod verify

builds:
  - id: june
    main: ./cmd/june
    binary: june
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: june
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: rules/**/*
        strip_parent: false

checksum:
  name_template: checksums.txt

changelog:
  disable: true

# `brews` is the only block that generates a Formula (homebrew_casks is macOS-only and cannot install
# shared data or declare the ast-grep dependency). goreleaser check reports it as deprecated; GoReleaser
# removes deprecated options only in a major version, and the release workflow pins v2.
brews:
  - name: june
    ids: [june]
    # A snapshot is not uploaded, so the GitHub asset URL 404s and brew reports a sha256 mismatch
    # against the local archive. Snapshots use that archive; a tagged release uses the asset URL.
    url_template: "{{ if .IsSnapshot }}file://{{ abs .ArtifactPath }}{{ else }}https://github.com/vicolby/june/releases/download/{{ urlPathEscape .Tag }}/{{ .ArtifactName }}{{ end }}"
    repository:
      owner: vicolby
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/vicolby/june
    description: Deterministic enforcement of code-guideline rules on the lines a change touches
    license: ""
    dependencies:
      - ast-grep
    install: |
      bin.install "june"
      (share/"june").install "rules"
    caveats: |
      The bundled rules are installed to #{HOMEBREW_PREFIX}/share/june/rules.
      Run `june rules-path` to print the directory, then pass a rule set with
      `june --rules "$(june rules-path)/python" ...`.
    test: |
      assert_match version.to_s, shell_output("#{bin}/june --version")
      assert_path_exists share/"june/rules"
